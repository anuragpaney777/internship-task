<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Temperature Converter</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><main class="container"><div class="converter"><p class="eyebrow">TASK 03</p><h1>Temperature <span>Converter</span></h1><p class="intro">Convert temperatures between Celsius, Fahrenheit and Kelvin.</p><label for="temperature">Temperature</label><input id="temperature" type="number" step="any" placeholder="Enter temperature"><label for="unit">Unit</label><select id="unit"><option value="celsius">Celsius (°C)</option><option value="fahrenheit">Fahrenheit (°F)</option><option value="kelvin">Kelvin (K)</option></select><button id="convertBtn">Convert Temperature →</button><p id="message"></p><div class="results"><div><small>Celsius</small><strong id="celsiusResult">—</strong></div><div><small>Fahrenheit</small><strong id="fahrenheitResult">—</strong></div><div><small>Kelvin</small><strong id="kelvinResult">—</strong></div></div><a class="back" href="../index.html">← Back to Tasks</a></div></main><script src="script.js"></script></body></html>
